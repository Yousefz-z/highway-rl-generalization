name: Bug report
description: Something in the pipeline fails, or a number looks wrong
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran and what came back. Paste the full error.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command
      placeholder: python evaluate.py --algo dqn --seed 0
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and operating system
      placeholder: "3.11.9, macOS 15.5"
    validations:
      required: true

  - type: checkboxes
    id: pinned
    attributes:
      label: Environment
      options:
        - label: I installed from the pinned requirements.txt in this repository
          required: true
