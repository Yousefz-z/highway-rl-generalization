name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group dev

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy .

      # A short end to end run of the pipeline. Not a test suite: it exists so
      # that a change which breaks training, checkpoint loading or the metric
      # computation fails here rather than after hours of training.
      - name: Smoke run
        run: |
          python train.py --algo dqn --seed 99 --timesteps 200
          python evaluate.py --algo dqn --seed 99 --episodes 2 --csv /tmp/smoke.csv
          python evaluate.py --algo random --seed 99 --episodes 2 --csv /tmp/smoke.csv
          python make_figures.py --csv /tmp/smoke.csv --out-dir /tmp/smoke-figures
